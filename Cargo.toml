[package]
name = "zed_csharp"
version = "1.0.2"
edition = "2021"
publish = false
license = "Apache-2.0"

[lib]
path = "src/csharp.rs"
crate-type = ["cdylib"]

[dependencies]
zed_extension_api = "0.7.0"
serde = { version = "1.0", features = ["derive"] }
# preserve_order: launchSettings.json profiles must keep their order, the first "Project" one is the default
serde_json = { version = "1.0", features = ["preserve_order"] }
fs_extra = "1.3.0"