id = "csharp"
name = "C#"
description = "C# & Razor Support"
version = "1.1.2"
schema_version = 1
authors = [
    "fminkowski <fminkowski@gmail.com>",
    "Fabian Freimueller <fabianfreimueller@gmail.com>",
    "Kevin Müller <kevin.mueller1@outlook.com>"
]
repository = "https://github.com/kevin-mueller/zed-csharp"
snippets = "./snippets/csharp.json"

languages = ["CSharp", "Razor", "csproj"]

[language_servers.roslyn-official]
name = "Roslyn (Official)"
languages = ["CSharp", "Razor"]

[language_servers.roslyn-official.language_ids]
CSharp = "csharp"
Razor = "razor"

[language_servers.html-in-razor]
name = "HTML"
languages = ["Razor"]

[language_servers.html-in-razor.language_ids]
Razor = "html"

[grammars.c_sharp]
repository = "https://github.com/tree-sitter/tree-sitter-c-sharp"
commit = "485f0bae0274ac9114797fc10db6f7034e4086e3"

[grammars.razor]
repository = "https://github.com/kevin-mueller/tree-sitter-razor"
commit = "a20ca53063663e1f435c164b4d446e9a7ee72ea6"

[grammars.xml]
repository = "https://github.com/tree-sitter-grammars/tree-sitter-xml"
commit = "863dbc381f44f6c136a399e684383b977bb2beaa"
path = "xml"

[debug_adapters.netcoredbg]
schema_path = "debug_adapter_schemas/netcoredbg.json"

[debug_locators.csharp-project-runner]

[[capabilities]]
kind = "process:exec"
command = "dotnet"
args = ["**"]

[[capabilities]]
kind = "process:exec"
command = "git"
args = ["**"]

[[capabilities]]
kind = "process:exec"
command = "cat"
args = ["**"]

[[capabilities]]
kind = "process:exec"
command = "test"
args = ["**"]

[[capabilities]]
kind = "process:exec"
command = "find"
args = ["**"]

[[capabilities]]
kind = "process:exec"
command = "echo"
args = ["**"]

# Used to run `csharp-language-server --download` after an update
[[capabilities]]
kind = "process:exec"
command = "*"
args = ["--download"]

[[capabilities]]
kind = "download_file"
host = "github.com"
path = ["qwadrox", "netcoredbg", "**"]

[[capabilities]]
kind = "download_file"
host = "objects.githubusercontent.com"
path = ["**"]
